server.port=8080
spring.application.name=stockpulse-backend

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# LLM Gateway Configuration
llm.provider=litellm
llm.base-url=https://litellm-qc.zycus.net/v1/chat/completions
llm.api-key=sk-SfyNGxhcv7RnQKbZFWX2LQ
llm.model=qwen-cursor
llm.product=PC1
llm.cookie=6bf6da0e46dc446bd58693d49c303e18=f3f865650f0f8f3b30731936b2eb5857
llm.timeout-seconds=25

# Commerce Strategy & Agent Defaults
commerce.strategy.default-mode=AI_POWERED
commerce.agent.spike-multiplier=3.0

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:4200,http://localhost:3000
