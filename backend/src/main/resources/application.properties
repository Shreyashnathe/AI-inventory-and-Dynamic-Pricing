server.port=8080
spring.application.name=stockpulse-backend

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/StockPulse}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# LLM Gateway Configuration
llm.provider=${LLM_PROVIDER:litellm}
llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net/v1/chat/completions}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:qwen-cursor}
llm.product=${LLM_PRODUCT:PC1}
llm.cookie=${LLM_COOKIE:}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:25}

# Commerce Strategy & Agent Defaults
commerce.strategy.default-mode=${COMMERCE_STRATEGY_MODE:AI_POWERED}
commerce.agent.spike-multiplier=${COMMERCE_SPIKE_MULTIPLIER:3.0}

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:4200,http://localhost:3000

